[project]
name = "lora-swap-opt"
version = "0.2.0"
description = "LoRA adapter placement and request routing for multi-tenant LLM serving"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "gurobipy>=11.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
bench = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
