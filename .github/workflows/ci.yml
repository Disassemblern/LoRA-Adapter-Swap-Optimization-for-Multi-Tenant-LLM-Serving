name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # gurobipy ships a size-limited license (2000 vars/constraints);
      # every test instance is kept under that limit, so no license file is needed.
      - run: pip install -e ".[dev]"
      - run: pytest -q
